# Interno: lo usa el frontend en http://svc-ordenes (namespace tienda).
# Prometheus leerá /metrics por el puerto "http" (ServiceMonitor, etapa de monitoreo).
apiVersion: v1
kind: Service
metadata:
  name: svc-ordenes
  labels:
    app.kubernetes.io/name: svc-ordenes
spec:
  selector:
    app.kubernetes.io/name: svc-ordenes
  ports:
    - name: http
      port: 80
      targetPort: http
