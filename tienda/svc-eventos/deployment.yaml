# svc-eventos · 2 réplicas (la rúbrica pide al menos un backend con 2 o más)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-eventos
  labels:
    app.kubernetes.io/name: svc-eventos
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: svc-eventos
  template:
    metadata:
      labels:
        app.kubernetes.io/name: svc-eventos
    spec:
      nodeSelector:
        boletera.io/app: "true"            # k8s-w1, con el resto de la tienda
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001                   # el usuario "app" de la imagen
      containers:
        - name: svc-eventos
          image: docker.io/obeedt/devops-eventos   # la etiqueta la pone kustomization.yaml
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: svc-eventos-config
          env:
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: APP_DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: APP_DB_PASSWORD
          # Recibe tráfico solo si la base responde
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          # Se reinicia si el proceso deja de responder (no depende de la base)
          livenessProbe:
            httpGet:
              path: /health/vivo
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
