# Configuración de svc-reservaciones (lo que NO es secreto).
# La base, el usuario y la contraseña se toman de postgres-config y
# postgres-app (deployment.yaml), para no repetirlos.
apiVersion: v1
kind: ConfigMap
metadata:
  name: svc-reservaciones-config
data:
  OTEL_SERVICE_NAME: svc-reservaciones
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_POOL_MAX: "5"              # conexiones máximas
  LOG_LEVEL: INFO
  # 0 a 1: fracción de peticiones que responden 500 a propósito (demo 3).
  # Se cambia con un commit, como todo lo demás.
  ERROR_RATE: "0"
  RESERVA_MINUTOS: "10"         # cuánto tiempo quedan apartados los lugares sin pagar
  LIBERADOR_SEGUNDOS: "60"      # cada cuánto se liberan las reservaciones vencidas
  # OTEL_EXPORTER_OTLP_ENDPOINT se agrega en la etapa de logs y trazas (Jaeger)
