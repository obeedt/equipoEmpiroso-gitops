# PostgreSQL 18.7 en un StatefulSet con su volumen en NFS.
# Si el pod se borra o cambia de nodo, vuelve a montar el MISMO volumen
# (PVC datos-postgres-0) y los datos siguen ahí.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  # Borrar o escalar el StatefulSet NO borra el volumen con los datos
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      nodeSelector:
        boletera.io/app: "true"            # k8s-w1, junto a la tienda
      # Tiempo para que PostgreSQL cierre limpio (guarda todo en disco) al detenerse
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: docker.io/library/postgres:18.7-trixie
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - configMapRef:
                name: postgres-config
          # Dos Secrets separados (no están en Git, ver tienda/README.md):
          #   postgres-admin → contraseña del administrador "postgres"; solo la usa este pod.
          #   postgres-app   → contraseña de boletera_app; también la montan los microservicios.
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-admin
                  key: POSTGRES_PASSWORD
            - name: APP_DB_PASSWORD             # la usa init/03-usuario-app.sh al crear el usuario
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: APP_DB_PASSWORD
          # Desde PostgreSQL 18 la imagen oficial guarda los datos en
          # /var/lib/postgresql/18/docker y el volumen va en /var/lib/postgresql.
          # (Montarlo en la ruta antigua, /var/lib/postgresql/data, NO conservaría los datos.)
          volumeMounts:
            - name: datos
              mountPath: /var/lib/postgresql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          # La primera vez crea la base y corre los scripts: se le da hasta 5 min
          startupProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U postgres -d \"$POSTGRES_DB\""]
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U postgres -d \"$POSTGRES_DB\""]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U postgres -d \"$POSTGRES_DB\""]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: init
          configMap:
            name: postgres-init
  # Un PVC por pod, creado a partir de esta plantilla: datos-postgres-0.
  # En el NFS queda en /srv/nfs/k8s/tienda-datos-postgres-0
  volumeClaimTemplates:
    - metadata:
        name: datos
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: nfs
        resources:
          requests:
            storage: 5Gi
