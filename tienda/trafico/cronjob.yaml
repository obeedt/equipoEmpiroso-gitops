# Generador de tráfico · APAGADO por defecto
#
# Es un CronJob suspendido: nunca corre solo. Cada vez que se quiere tráfico
# se lanza una ejecución, que dura DURACION_MIN y termina sola:
#
#   kubectl -n tienda create job trafico-$(date +%H%M) --from=cronjob/trafico   # encender
#   kubectl -n tienda delete job -l app.kubernetes.io/name=trafico              # apagar antes
#
# Lanzar o detener una ejecución no cambia nada de lo que está en Git:
# Argo CD sigue en Synced y el CronJob sigue suspendido.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: trafico
  labels:
    app.kubernetes.io/name: trafico
    app.kubernetes.io/part-of: boletera
spec:
  suspend: true                 # nunca por horario; solo a mano
  schedule: "0 0 1 1 *"         # obligatorio en un CronJob; no se usa
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: trafico
        app.kubernetes.io/part-of: boletera
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1500       # tope de seguridad: 25 min
      ttlSecondsAfterFinished: 900      # el Job terminado se borra a los 15 min
      template:
        metadata:
          labels:
            app.kubernetes.io/name: trafico
            app.kubernetes.io/part-of: boletera
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
          containers:
            - name: trafico
              image: docker.io/library/python:3.14.10-slim-trixie
              command: ["python", "/app/trafico.py"]
              env:
                - { name: DURACION_MIN, value: "20" }   # cuánto dura cada ejecución
                - { name: PAUSA_SEG, value: "2" }       # segundos entre "clientes"
                - { name: CARRITO_CADA, value: "5" }    # cada cuántos clientes aparta y cancela
                - { name: ORDEN_ID, value: "91442" }    # pedido que consulta (svc-ordenes)
                - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { memory: 96Mi }
              volumeMounts:
                - { name: script, mountPath: /app, readOnly: true }
          volumes:
            - name: script
              configMap:
                name: trafico-script
