# frontend · el sitio web de la boletera · Argo CD lo aplica (apps/frontend.yaml)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tienda

labels:
  - pairs:
      app.kubernetes.io/part-of: boletera
    includeSelectors: false

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# Versión desplegada = SHA corto del commit en equipoEmpiroso-app.
# Tekton cambia esta línea en cada build; Argo CD despliega el cambio.
images:
  - name: docker.io/obeedt/devops-frontend
    newTag: 3283aff

# Configuración en config.env. El nombre del ConfigMap lleva un sufijo con el
# hash de su contenido y Kustomize lo pone en el Deployment: cambiar un valor
# (ERROR_RATE, BANNER...) crea pods nuevos que lo leen, sin reiniciar a mano.
configMapGenerator:
  - name: frontend-config
    envs: [config.env]
