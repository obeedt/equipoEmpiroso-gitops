# frontend · 2 réplicas (la rúbrica pide el frontend con 2 o más)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
    spec:
      nodeSelector:
        boletera.io/app: "true"            # k8s-w1, con el resto de la tienda
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001                   # el usuario "app" de la imagen
      containers:
        - name: frontend
          image: docker.io/obeedt/devops-frontend   # la etiqueta la pone kustomization.yaml
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: frontend-config
          # /health no depende de los otros servicios: si uno se cae, la
          # tienda sigue en el Ingress y muestra su página de error con folio
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/vivo
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
