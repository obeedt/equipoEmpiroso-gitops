# Configura OpenSearch y Dashboards (configurar.sh) después de cada
# sincronización de la Application "logging": retención de 7 días,
# plantilla de índices, index patterns, búsqueda "Errores de la tienda" y
# trace_id como enlace a Jaeger. Todo queda en Git, sin clics a mano.
apiVersion: batch/v1
kind: Job
metadata:
  name: configurar-opensearch
  annotations:
    argocd.argoproj.io/hook: PostSync
    # Se borra el Job anterior antes de crear el nuevo (el último queda para ver su log)
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: configurar-opensearch
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
      containers:
        - name: configurar
          image: docker.io/curlimages/curl:8.17.0
          command: ["sh", "/configuracion/configurar.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          volumeMounts:
            - { name: configuracion, mountPath: /configuracion, readOnly: true }
      volumes:
        - name: configuracion
          configMap:
            name: configuracion-opensearch
