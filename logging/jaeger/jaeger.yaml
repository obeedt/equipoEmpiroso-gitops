# Jaeger 2.22.0 en k8s-w2: un solo proceso que recibe trazas (OTLP 4317/4318),
# las guarda en OpenSearch y sirve la UI (16686).
# Los servicios de la tienda le envían a http://jaeger.logging:4318
# (OTEL_EXPORTER_OTLP_ENDPOINT en tienda/<servicio>/config.env).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  labels:
    app.kubernetes.io/name: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
    spec:
      nodeSelector:
        boletera.io/logs: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: jaeger
          image: docker.io/jaegertracing/jaeger:2.22.0
          args: ["--config=/etc/jaeger/config.yaml"]
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: ui, containerPort: 16686 }
            - { name: salud, containerPort: 13133 }
            - { name: metricas, containerPort: 8888 }
          # Listo cuando ya se conectó a OpenSearch
          readinessProbe:
            httpGet: { path: /status, port: salud }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /status, port: salud }
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/jaeger, readOnly: true }
      volumes:
        - name: config
          configMap:
            name: jaeger-config
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  labels:
    app.kubernetes.io/name: jaeger
spec:
  selector:
    app.kubernetes.io/name: jaeger
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
    - { name: ui, port: 16686, targetPort: ui }
    - { name: metricas, port: 8888, targetPort: metricas }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jaeger
spec:
  ingressClassName: traefik
  rules:
    - host: jaeger.100.103.221.107.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jaeger
                port:
                  name: ui
