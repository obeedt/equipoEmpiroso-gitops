# Fluent Bit 5.1.2 (chart 0.58.2) · Argo CD: apps/fluent-bit.yaml
#
# DaemonSet en los 4 nodos: lee los logs de los contenedores del nodo y los
# manda a OpenSearch, en dos índices diarios:
#   boletera-logs-AAAA.MM.DD  namespace tienda: el JSON de cada log se vuelve
#                             campos propios (nivel, servicio, trace_id...)
#   cluster-logs-AAAA.MM.DD   el resto de los namespaces, como texto
# Separados, los formatos de cada aplicación no chocan entre sí.
# No se leen los logs de "logging", para que Fluent Bit no se lea a sí mismo.

# La imagen de cr.fluentbit.io pide autenticación; la de Docker Hub baja por
# el espejo mirror.gcr.io, igual que las demás
image:
  repository: docker.io/fluent/fluent-bit
  tag: "5.1.2"

# También en el control plane (sus pods del sistema también escriben logs)
tolerations:
  - operator: Exists
    effect: NoSchedule

resources:
  requests: { cpu: 20m, memory: 32Mi }
  limits: { memory: 128Mi }

# containerd guarda los logs en /var/log/pods (enlazados desde
# /var/log/containers); /var/lib/docker no existe en estos nodos
daemonSetVolumes:
  - name: varlog
    hostPath:
      path: /var/log
  - name: etcmachineid
    hostPath:
      path: /etc/machine-id
      type: File
daemonSetVolumeMounts:
  - name: varlog
    mountPath: /var/log
  - name: etcmachineid
    mountPath: /etc/machine-id
    readOnly: true

config:
  inputs: |
    # Tienda: un tag propio para tratar su JSON aparte
    [INPUT]
        Name              tail
        Path              /var/log/containers/*_tienda_*.log
        Tag               tienda.*
        multiline.parser  cri
        DB                /var/log/fluent-bit-tienda.db
        Mem_Buf_Limit     10MB
        Skip_Long_Lines   On
        Refresh_Interval  10

    # Todo lo demás, menos tienda y logging
    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        Exclude_Path      /var/log/containers/*_tienda_*.log,/var/log/containers/*_logging_*.log
        Tag               kube.*
        multiline.parser  cri
        DB                /var/log/fluent-bit-kube.db
        Mem_Buf_Limit     10MB
        Skip_Long_Lines   On
        Refresh_Interval  10

  filters: |
    # Tienda: agrega pod, namespace y contenedor, y convierte el JSON del
    # log en campos (nivel, servicio, mensaje, trace_id...)
    [FILTER]
        Name                kubernetes
        Match               tienda.*
        Kube_Tag_Prefix     tienda.var.log.containers.
        Merge_Log           On
        Keep_Log            Off
        Labels              Off
        Annotations         Off

    # Resto del clúster: solo pod, namespace y contenedor; el log queda como texto
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           Off
        Labels              Off
        Annotations         Off

  outputs: |
    [OUTPUT]
        Name                opensearch
        Match               tienda.*
        Host                opensearch-cluster-master.logging.svc
        Port                9200
        Logstash_Format     On
        Logstash_Prefix     boletera-logs
        Suppress_Type_Name  On
        Replace_Dots        On
        Buffer_Size         512KB
        Trace_Error         On
        Retry_Limit         10

    [OUTPUT]
        Name                opensearch
        Match               kube.*
        Host                opensearch-cluster-master.logging.svc
        Port                9200
        Logstash_Format     On
        Logstash_Prefix     cluster-logs
        Suppress_Type_Name  On
        Replace_Dots        On
        Buffer_Size         512KB
        Trace_Error         On
        Retry_Limit         10
