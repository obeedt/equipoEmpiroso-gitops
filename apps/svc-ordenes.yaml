# svc-ordenes · pago de reservaciones y pedidos
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: svc-ordenes
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/obeedt/equipoEmpiroso-gitops.git
    targetRevision: main
    path: tienda/svc-ordenes
  destination:
    server: https://kubernetes.default.svc
    namespace: tienda
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
