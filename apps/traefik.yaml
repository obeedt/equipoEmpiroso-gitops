# Traefik · Ingress controller
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  sources:
    # 1) El chart oficial, en versión fija
    - repoURL: https://traefik.github.io/charts
      chart: traefik
      targetRevision: 42.2.0
      helm:
        releaseName: traefik
        valueFiles:
          - $values/plataforma/traefik/values.yaml
    # 2) Este repo, solo para leer el values.yaml de arriba ($values)
    - repoURL: https://github.com/obeedt/equipoEmpiroso-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true      # las CRDs de Traefik son grandes
