# local-path-provisioner · volúmenes en el disco de cada worker
#
# El chart está copiado en este repo (plataforma/local-path/chart), tal cual
# viene en la etiqueta v0.0.37 de github.com/rancher/local-path-provisioner
# (licencia Apache 2.0). Rancher no publica un repositorio de Helm, y clonar
# su repositorio completo hacía que Argo CD se rindiera por tiempo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-path
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/obeedt/equipoEmpiroso-gitops.git
    targetRevision: main
    path: plataforma/local-path/chart
    helm:
      releaseName: local-path-provisioner
      valueFiles:
        - ../values.yaml          # plataforma/local-path/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: local-path-storage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
