# Driver CSI de NFS (aprovisionamiento dinámico sobre el NFS de k8s-cp)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nfs-csi
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts
      chart: csi-driver-nfs
      targetRevision: 4.13.6
      helm:
        releaseName: csi-driver-nfs
        valueFiles:
          - $values/plataforma/nfs/values.yaml
    - repoURL: https://github.com/obeedt/equipoEmpiroso-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
