# Fluent Bit 5.1.2 · recolector de logs en los 4 nodos → OpenSearch
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fluent-bit
  namespace: argocd
spec:
  project: default
  sources:
    # 1) El chart oficial, en versión fija
    - repoURL: https://fluent.github.io/helm-charts
      chart: fluent-bit
      targetRevision: 0.58.2
      helm:
        releaseName: fluent-bit
        valueFiles:
          - $values/logging/fluent-bit/values.yaml
    # 2) Este repo, solo para leer el values.yaml de arriba ($values)
    - repoURL: https://github.com/obeedt/equipoEmpiroso-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
