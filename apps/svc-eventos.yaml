# svc-eventos · catálogo de conciertos
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: svc-eventos
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/obeedt/equipoEmpiroso-gitops.git
    targetRevision: main
    path: tienda/svc-eventos
  destination:
    server: https://kubernetes.default.svc
    namespace: tienda
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
