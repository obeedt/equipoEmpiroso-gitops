apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/obeedt/equipoEmpiroso-gitops.git
    targetRevision: main
    path: apps
    directory:
      exclude: root.yaml        # no se administra a sí misma
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true               # si se borra un archivo de apps/, se borra su Application
      selfHeal: true            # si alguien cambia algo a mano, se regresa a lo que dice Git