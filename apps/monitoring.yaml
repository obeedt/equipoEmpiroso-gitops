# Monitoreo propio de la boletera: ServiceMonitors, PrometheusRule (6 alertas),
# envío a Telegram (AlertmanagerConfig) y los 3 dashboards de Grafana.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/obeedt/equipoEmpiroso-gitops.git
    targetRevision: main
    path: monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # ServiceMonitor, PrometheusRule y AlertmanagerConfig: sus CRDs las
      # instala la Application kube-prometheus-stack
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
