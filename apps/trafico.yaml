# Generador de tráfico de la tienda: CronJob suspendido que se lanza a mano
# para tener datos en el dashboard de aplicación y probar la alerta de 5xx.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trafico
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/obeedt/equipoEmpiroso-gitops.git
    targetRevision: main
    path: tienda/trafico
  destination:
    server: https://kubernetes.default.svc
    namespace: tienda
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
