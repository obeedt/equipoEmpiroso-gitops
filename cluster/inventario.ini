# ─────────────────────────────────────────────────────────────────────
# Inventario del clúster Boletera (proyecto 3)
#
# IMPORTANTE: ansible_host = IP de TAILSCALE de cada VM (100.x.y.z),
# no la IP de VMware ni la LAN. Sácala desde el dashboard de Tailscale
# o en cada VM con:
#     tailscale ip -4
#
# Ansible se ejecuta DESDE el control plane (k8s-cp). Por eso ese host
# usa ansible_connection=local: si algo de red se rompe a medio camino,
# el playbook no pierde la conexión con el nodo más importante.
#
# zona           = dónde vive la VM (laptop | proxmox). Informativa.
# boletera_roles = qué cargas recibe el worker, separadas por coma y SIN
#                  espacios (app | logs | metricas). El playbook 04 las convierte
#                  en etiquetas boletera.io/<rol>=true, que son las que
#                  usan los nodeSelector del repo GitOps.
#
# Si mueves un worker a otra máquina, cambia su zona y su IP; si juntas
# dos workers en uno, dale los dos roles (p. ej. boletera_roles=logs,metricas)
# y vuelve a correr 04-workers.yml: los manifiestos no cambian.
# ─────────────────────────────────────────────────────────────────────

[control_plane]
k8s-cp  ansible_host=100.108.78.119  ansible_connection=local  zona=laptop

[workers]
k8s-w1  ansible_host=100.103.221.107  zona=laptop   boletera_roles=app
k8s-w2  ansible_host=100.105.140.124  zona=proxmox  boletera_roles=logs
k8s-w3  ansible_host=100.85.132.48  zona=proxmox  boletera_roles=metricas

[nfs_server]
k8s-cp

[k8s:children]
control_plane
workers

[k8s:vars]
# Usuario con sudo sin contraseña en los workers
ansible_user=ansible
ansible_become=true
